# ntfy server for relay's notifications. It listens on loopback only; put
# HTTPS in front of it for the phone, for example with `tailscale serve`,
# and set base-url to the address the phone uses.
base-url: "https://your-mac.example:8443"
listen-http: "127.0.0.1:2586"
behind-proxy: true

# Messages are kept so a phone that was offline catches up when it reconnects.
cache-file: "/path/to/ntfy/cache.db"
cache-duration: "168h"

# iOS only delivers instantly through Apple's push service. With this set,
# ntfy.sh is sent a hash of the topic and no message content; the phone
# then fetches the message from this server.
upstream-base-url: "https://ntfy.sh"

web-root: disable

# Lock the server down, so only relay can publish and only your phone can
# read. Nothing is allowed unless a user or token says so:
#
#   auth-file: "/path/to/ntfy/user.db"
#   auth-default-access: "deny-all"
#
# Then, with the server's config, make a user for the phone with read
# access to the topic, and a token for relay with write access:
#
#   ntfy user add phone
#   ntfy access phone <topic> read-only
#   ntfy user add relay
#   ntfy access relay <topic> write-only
#   ntfy token add relay        # prints tk_...; keep it in a file only you can read
#
# Use a topic nobody could guess (openssl rand -hex 16), and give relay the
# token in relay.edn with :token-file or :token-command (see README).
